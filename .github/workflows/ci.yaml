name: Frontend CI

on:
  push:
    branches: [Eduardo_mobile_app_layout_branch]
  pull_request:
    branches: [Eduardo_mobile_app_layout_branch]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build React application
        run: npm run build

      - name: Login in GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/EduardoAcostaVargas/stride-frontend:latest .
      
      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push ghcr.io/EduardoAcostaVargas/stride-frontend:latest