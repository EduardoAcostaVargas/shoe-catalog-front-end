name: Frontend CI

on:
  push:
    branches: [Eduardo_mobile_app_layout_branch]
  pull_request:
    branches: [Eduardo_mobile_app_layout_branch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build